<app-header-modal [titulo]="titulo + ' Visita'" (cerrar)="salir()"></app-header-modal>

    <ion-list-header>
        <ion-label color="primarytext">
            <h4>PROYECTO Nro. {{visita.codigo_expediente}}</h4>
            <!-- <h4>VISITA: {{visita.nid_visita ? 'Nro. ' + visita.nid_visita : 'NUEVA'}} ({{visita.fec_visita | date:'dd/MM/yyyy'}})</h4> -->
        </ion-label>
    </ion-list-header>
    
    <ion-list>
        <ion-item>
            <ion-label>NOTA: Es <ion-text class="negrita">obligatorio</ion-text> que en la foto cargada en esta sección se encuentre presente el agente.</ion-label>
        </ion-item>
        <ion-item>
            <ion-label color="tertiary">FECHA VISITA:</ion-label>
            <ion-label class="ion-text-right">{{visita.fec_visita | date:'dd/MM/yyyy'}}</ion-label>
        </ion-item>
        <ion-item>
            <ion-textarea [(ngModel)]="visita.txt_observacion" labelPlacement="stacked" placeholder="Registre un comentario" [autoGrow]="true">
                <div slot="label" class="custom-label-stacked">Comentario de la visita:</div>
            </ion-textarea>
        </ion-item>
        <ion-item>
            <ion-label color="tertiary">FOTOGRAFIA DEL AGENTE EN CAMPO</ion-label>
        </ion-item>
    </ion-list>

    <app-fotos [fotos]="fotos" [consulta]="consulta" [verMapa]="true"></app-fotos>

<ion-footer *ngIf="!consulta" mode="ios" translucent="true">
    <ion-toolbar mode="ios" class="ion-text-center">
        <ion-button class="custom-centrado" shape="round" color="primary" (click)="guardar()">Guardar</ion-button>
